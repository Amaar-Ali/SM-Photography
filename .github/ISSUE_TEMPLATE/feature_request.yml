name: Feature request
description: Suggest an improvement for the SM Photography site
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Say what problem you want solved. Do not invent studio facts or replace real photography.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing for visitors planning a wedding?
      placeholder: On mobile, it is hard to…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would help? Keep it honest — no need for a full design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Home / hero
        - Chapters / stories
        - Films
        - Contact / enquiry
        - SEO / performance
        - Docs / DX
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
